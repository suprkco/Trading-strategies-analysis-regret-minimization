# Render Blueprint: New > Blueprint > select this repository. Standard library only; nothing to install.
services:
  - type: web
    name: online-regret-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m regret_lab.web
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.7
