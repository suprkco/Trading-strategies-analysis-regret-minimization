name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: python -m regret_lab.cli --rounds 100
      - run: python -m scripts.benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-${{ matrix.python }}
          path: evaluation/results.json
      - run: |
          HOST=127.0.0.1 PORT=8000 python -m regret_lab.web &
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8000/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:8000/ | grep -q 'Watch Hedge learn'
          curl -fsS 'http://127.0.0.1:8000/api/run?scenario=noise&rounds=200' | grep -q '"rounds": 200'
